version: '3.4'

services:
  api:
    container_name: ites.server
    image: itesserver
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      #- ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    build:
      context: .
      dockerfile: ./ites.Server/Dockerfile
    volumes:
      - ./ssl:/app/ssl
      - ./:/app
    networks:
      - ites
    depends_on:
      - db

  db:
    container_name: ites.db
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: itesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    networks:
      - ites
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  ites:
    driver: bridge

volumes:
  postgres-data:
