services:
  api:
    container_name: ites.server
    ports:
      - "8080:8080"
    build:
      context: .
      dockerfile: ./Dockerfile
    volumes:
      - ./:/src
    networks:
      - ites
    depends_on:
      db:
        condition: service_healthy

  db:
    container_name: ites.db
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ites -d itesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ites
    volumes:
      - postgres_data:/var/lib/postgresql

networks:
  ites:
    driver: bridge

volumes:
  postgres_data:
