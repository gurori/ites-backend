  db:
    container_name: ites.db
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: itesdb
      POSTGRES_USER: gurori
      POSTGRES_PASSWORD: Egorzak_21
    networks:
      - ites
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  ites:
    driver: bridge

volumes:
  postgres-data: