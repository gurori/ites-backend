version: '3.4'

services:
  ites.server:
    image: ${DOCKER_REGISTRY-}itesserver
    build:
      context: .
      dockerfile: ites.Server/Dockerfile
    volumes:
      - ./:/app
    networks:
      - ites
    depends_on:
      - db
  
