services:
  api:
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Kestrel__Endpoints__Https__Certificate__Password: "${CERT_PASSWORD}"
      JwtOptions__SecretKey: "${JWT_SECRET}"
      ORGANIZER_CONFIRM_KEY: "${ORGANIZER_CONFIRM_KEY}"
    volumes:
      - ./certs/certificate.pfx:/https/certificate.pfx:ro
      - ./:/src

  db:
    expose:
      - "5432"
    environment:
      POSTGRES_DB: itesdb
      POSTGRES_USER: ites
      POSTGRES_PASSWORD: ites

  site:
    build:
      context: ../site
      dockerfile: Dockerfile
    container_name: ites.site
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_completed_successfully
