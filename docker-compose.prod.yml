services:
  api:
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      JwtOptions__SecretKey: "${JWT_SECRET}"
      ORGANIZER_CONFIRM_KEY: "${ORGANIZER_CONFIRM_KEY}"
    volumes:
      - ./:/src

  db:
    expose:
      - "5432"
    environment:
      POSTGRES_DB: itesdb
      POSTGRES_USER: ites
      POSTGRES_PASSWORD: ites

  site:
    build:
      context: ../site
      dockerfile: Dockerfile
    container_name: ites.site
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_completed_successfully
    networks:
      - app
  
  nginx:
    image: nginx:alpine
    container_name: ites.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/fullchain.crt:/etc/nginx/ssl/fullchain.crt:ro
      - ./ssl/private.key:/etc/nginx/ssl/private.key:ro
    depends_on:
      - site
      - api
    restart: unless-stopped
    networks:
      - app
