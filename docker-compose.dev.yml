services:
  api:
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ORGANIZER_CONFIRM_KEY=198301
    volumes:
      - ./:/src

  db:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: itesdb
      POSTGRES_USER: ites
      POSTGRES_PASSWORD: ites

  pgadmin:
    container_name: ites.pgadmin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - database
